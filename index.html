<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pulsantiera Fallout</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body {
    background-color: #0a0a0a;
    color: #00ff00;
    font-family: 'Courier New', monospace;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}

/* Loading screen */
#loading {
    text-align: center;
}

#vaultboy {
    width: 200px;
    max-width: 80%;
}

#loadingText {
    margin-top: 20px;
    font-size: 1.5rem;
    letter-spacing: 2px;
}

/* Keypad */
#keypad {
    display: none;
    text-align: center;
}

#screen {
    width: 90%;
    max-width: 400px;
    height: 50px;
    margin-bottom: 20px;
    border: 2px solid #00ff00;
    color: #00ff00;
    font-size: 1.5rem;
    display: flex;
    justify-content: center;
    align-items: center;
    letter-spacing: 10px;
    background-color: #001100;
    margin-left: auto;
    margin-right: auto;
}

@media (min-width: 576px) {
    #screen {
        font-size: 2rem;
        letter-spacing: 15px;
    }
}

.btn-fallout {
    background-color: #003300;
    border: 2px solid #00ff00;
    color: #00ff00;
    font-size: 1.5rem;
    width: 80px;
    height: 80px;
    margin: 5px;
    transition: all 0.1s;
}

.btn-fallout:hover {
    background-color: #005500;
    transform: scale(1.1);
}
</style>
</head>
<body>

<!-- Loading screen -->
<div id="loading">
    <img id="vaultboy" src="https://images.steamusercontent.com/ugc/450708155970227041/1BD6800FDE42305F5B1BEFF93C89E8C09B8A7954/?imw=5000&imh=5000&ima=fit&impolicy=Letterbox&imcolor=%23000000&letterbox=false" alt="Vault Boy Thumbs Up">
    <div id="loadingText">CARICAMENTO...</div>
</div>

<!-- Keypad -->
<div id="keypad" class="container">
    <div id="screen">*****</div>
    <div class="row justify-content-center mb-2">
        <button class="btn btn-fallout col-3 col-sm-2" data-num="1">1</button>
        <button class="btn btn-fallout col-3 col-sm-2" data-num="2">2</button>
        <button class="btn btn-fallout col-3 col-sm-2" data-num="3">3</button>
    </div>
    <div class="row justify-content-center mb-2">
        <button class="btn btn-fallout col-3 col-sm-2" data-num="4">4</button>
        <button class="btn btn-fallout col-3 col-sm-2" data-num="5">5</button>
        <button class="btn btn-fallout col-3 col-sm-2" data-num="6">6</button>
    </div>
    <div class="row justify-content-center mb-2">
        <button class="btn btn-fallout col-3 col-sm-2" data-num="7">7</button>
        <button class="btn btn-fallout col-3 col-sm-2" data-num="8">8</button>
        <button class="btn btn-fallout col-3 col-sm-2" data-num="9">9</button>
    </div>
    <div class="row justify-content-center mb-2">
        <button class="btn btn-fallout col-6 col-sm-3" id="clearBtn">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" class="bi bi-arrow-counterclockwise" viewBox="0 0 16 16">
                <path fill-rule="evenodd" d="M8 3a5 5 0 1 1-4.546 2.914.5.5 0 0 0-.908-.417A6 6 0 1 0 8 2v1z"/>
                <path d="M8 4.466V.534a.25.25 0 0 0-.41-.192L5.23 2.308a.25.25 0 0 0 0 .384l2.36 1.966A.25.25 0 0 0 8 4.466z"/>
            </svg>
        </button>
    </div>
</div>

<!-- Audio -->
<audio id="sound1" preload="auto"><source src="https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3" type="audio/mpeg"></audio>
<audio id="sound2" preload="auto"><source src="https://assets.mixkit.co/active_storage/sfx/2570/2570-preview.mp3" type="audio/mpeg"></audio>
<audio id="sound3" preload="auto"><source src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" type="audio/mpeg"></audio>
<audio id="sound4" preload="auto"><source src="https://assets.mixkit.co/active_storage/sfx/2870/2870-preview.mp3" type="audio/mpeg"></audio>
<audio id="sound5" preload="auto"><source src="https://assets.mixkit.co/active_storage/sfx/2573/2573-preview.mp3" type="audio/mpeg"></audio>
<audio id="sound6" preload="auto"><source src="https://assets.mixkit.co/active_storage/sfx/2574/2574-preview.mp3" type="audio/mpeg"></audio>
<audio id="sound7" preload="auto"><source src="https://assets.mixkit.co/active_storage/sfx/2575/2575-preview.mp3" type="audio/mpeg"></audio>
<audio id="sound8" preload="auto"><source src="https://assets.mixkit.co/active_storage/sfx/2576/2576-preview.mp3" type="audio/mpeg"></audio>
<audio id="sound9" preload="auto"><source src="https://assets.mixkit.co/active_storage/sfx/2577/2577-preview.mp3" type="audio/mpeg"></audio>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
const loading = document.getElementById('loading');
const keypad = document.getElementById('keypad');
const buttons = document.querySelectorAll('.btn-fallout');
const screen = document.getElementById('screen');

let codeLength = 7;
let currentIndex = 0;
let display = Array(codeLength).fill('*');
screen.textContent = display.join('');

// Preload tutti i suoni
for (let i = 1; i <= 9; i++) {
    document.getElementById('sound' + i).load();
}

setTimeout(() => {
    loading.style.display = 'none';
    keypad.style.display = 'block';
}, 3000);

buttons.forEach(btn => {
    btn.addEventListener('click', () => {
        if (currentIndex < codeLength) {
            const num = btn.dataset.num;
            const sound = document.getElementById('sound' + num);
            sound.pause();
            sound.currentTime = 0;
            sound.play().catch(e => {
                console.log("Audio bloccato dal browser.");
            });
            display[currentIndex] = num;
            screen.textContent = display.join('');
            currentIndex++;
            
            // Controlla se il codice è completo
            if (currentIndex === codeLength) {
                setTimeout(() => {
                    const enteredCode = display.join('');
                    if (enteredCode === '1111111') {
                        // Codice corretto!
                        keypad.innerHTML = `
                            <div style="text-align: center; padding: 40px;">
                                <h1 style="color: #00ff00; font-size: 3rem; margin-bottom: 30px; animation: blink 1s infinite;">✓ ACCESSO CONCESSO</h1>
                                <div style="border: 2px solid #00ff00; padding: 30px; background-color: #001100; display: inline-block;">
                                    <h2 style="margin-bottom: 20px; color: #00ff00;">COORDINATE BUNKER SEGRETO</h2>
                                    <p style="font-size: 1.5rem; margin: 10px 0;">LAT: 42°19'47.5"N</p>
                                    <p style="font-size: 1.5rem; margin: 10px 0;">LON: 71°05'11.3"W</p>
                                    <p style="font-size: 1.2rem; margin-top: 20px; color: #ffff00;">VAULT 111 - CLEARANCE LEVEL: ALPHA</p>
                                </div>
                            </div>
                        `;
                    } else {
                        // Codice errato
                        screen.style.backgroundColor = '#330000';
                        screen.style.color = '#ff0000';
                        screen.textContent = 'ERRORE';
                        setTimeout(() => {
                            currentIndex = 0;
                            display = Array(codeLength).fill('*');
                            screen.textContent = display.join('');
                            screen.style.backgroundColor = '#001100';
                            screen.style.color = '#00ff00';
                        }, 2000);
                    }
                }, 300);
            }
        }
    });
});

// Pulsante cancella
document.getElementById('clearBtn').addEventListener('click', () => {
    currentIndex = 0;
    display = Array(codeLength).fill('*');
    screen.textContent = display.join('');
});

// Codice corretto
const correctCode = '1111111';

// Controlla il codice quando è completo
buttons.forEach(btn => {
    const originalListener = btn.onclick;
    btn.addEventListener('click', () => {
        if (currentIndex === codeLength) {
            const enteredCode = display.join('');
            if (enteredCode === correctCode) {
                // Codice corretto!
                keypad.innerHTML = `
                    <div style="text-align: center; padding: 40px;">
                        <h1 style="color: #00ff00; font-size: 3rem; margin-bottom: 30px;">ACCESSO CONCESSO</h1>
                        <div style="border: 2px solid #00ff00; padding: 20px; background-color: #001100; display: inline-block;">
                            <h2 style="margin-bottom: 20px;">COORDINATE BUNKER</h2>
                            <p style="font-size: 1.5rem; margin: 10px 0;">LAT: 42°19'47.5"N</p>
                            <p style="font-size: 1.5rem; margin: 10px 0;">LON: 71°05'11.3"W</p>
                            <p style="font-size: 1.2rem; margin-top: 20px; color: #ffff00;">VAULT 111 - LIVELLO CLEARANCE ALPHA</p>
                        </div>
                    </div>
                `;
            } else {
                // Codice errato
                screen.style.backgroundColor = '#330000';
                screen.textContent = 'ERRORE';
                setTimeout(() => {
                    currentIndex = 0;
                    display = Array(codeLength).fill('*');
                    screen.textContent = display.join('');
                    screen.style.backgroundColor = '#001100';
                }, 2000);
            }
        }
    });
});
</script>
</body>
</html>
