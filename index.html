<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>V A U L T - T E C // A C C E S S O _ R I S T R E T T O</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body {
    background-color: #0a0a0a;
    color: #00ff00;
    font-family: 'Courier New', monospace;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}

/* Loading screen */
#loading {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
}

#vaultboy {
    width: 100vw;
    height: 100vh;
    object-fit: contain;
}

#loadingText {
    margin-top: 20px;
    font-size: 1.5rem;
    letter-spacing: 2px;
}

/* Keypad */
#keypad {
    display: none;
    text-align: center;
}

#screen {
    width: 90%;
    max-width: 400px;
    margin-bottom: 2vmin;
    border: 2px solid #00ff00;
    color: #00ff00;
    display: flex;
    justify-content: center;
    align-items: center;
    background-color: #001100;
    margin-left: auto;
    margin-right: auto;
}


.btn-fallout {
    background-color: #003300;
    border: 2px solid #00ff00;
    color: #00ff00;
    font-size: 5.5vmin;
    width: 16vmin;
    height: 16vmin;
    margin: 1.2vmin;
    transition: all 0.1s;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 0;
}

.btn-fallout:hover {
    background-color: #005500;
    transform: scale(1.1);
}

#screen {
    height: 10vmin;
    font-size: 5vmin;
    letter-spacing: 2vmin;
}


</style>
</head>
<body>

<!-- Loading screen -->
<div id="loading">
    <img id="vaultboy" src="loading.svg" alt="Loading">
    <!-- <div id="loadingText">CARICAMENTO...</div> -->
    <div class="text-end mt-2" style="position:absolute;bottom:8px;right:10px;color:#004400;font-family:'Courier New',monospace;font-size:0.55rem;">
        ⚠ FINZIONE — scenario softair.<br>Qualsiasi riferimento a luoghi reali è puramente narrativo.
    </div>
</div>

<!-- Keypad -->
<div id="keypad" class="container">
    <div id="screen">*****</div>
    <div class="row justify-content-center mb-2">
        <button class="btn btn-fallout" data-num="1" data-symbol="⍟" data-freq="440.00">⍟</button>
        <button class="btn btn-fallout" data-num="2" data-symbol="☢" data-freq="329.63">☢</button>
        <button class="btn btn-fallout" data-num="3" data-symbol="⊛" data-freq="493.88">⊛</button>
    </div>
    <div class="row justify-content-center mb-2">
        <button class="btn btn-fallout" data-num="4" data-symbol="▲" data-freq="noise">▲</button>
        <button class="btn btn-fallout" data-num="5" data-symbol="♦" data-freq="261.63">♦</button>
        <button class="btn btn-fallout" data-num="6" data-symbol="⌬" data-freq="349.23">⌬</button>
    </div>
    <div class="row justify-content-center mb-2">
        <button class="btn btn-fallout" data-num="7" data-symbol="⊕" data-freq="293.66">⊕</button>
        <button class="btn btn-fallout" data-num="8" data-symbol="◈" data-freq="392.00">◈</button>
        <button class="btn btn-fallout" data-num="9" data-symbol="✦" data-freq="glide">✦</button>
    </div>
    <div class="row justify-content-center mb-2">
        <button class="btn btn-fallout" id="clearBtn" style="width: calc(3 * 16vmin + 4 * 1.2vmin);" >
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" class="bi bi-arrow-counterclockwise" viewBox="0 0 16 16">
                <path fill-rule="evenodd" d="M8 3a5 5 0 1 1-4.546 2.914.5.5 0 0 0-.908-.417A6 6 0 1 0 8 2v1z"/>
                <path d="M8 4.466V.534a.25.25 0 0 0-.41-.192L5.23 2.308a.25.25 0 0 0 0 .384l2.36 1.966A.25.25 0 0 0 8 4.466z"/>
            </svg>
        </button>
    </div>
</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
const loading = document.getElementById('loading');
const keypad = document.getElementById('keypad');
const buttons = document.querySelectorAll('.btn-fallout');
const screen = document.getElementById('screen');

const fpIcon = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7.864 4.243A7.5 7.5 0 0 1 19.5 10.5c0 2.92-.556 5.709-1.568 8.268M5.742 6.364A7.465 7.465 0 0 0 4.5 10.5a7.464 7.464 0 0 1-1.15 3.993m1.989 3.559A11.209 11.209 0 0 0 8.25 10.5a3.75 3.75 0 1 1 7.5 0c0 .527-.021 1.049-.064 1.565M12 10.5a14.94 14.94 0 0 1-3.6 9.75m6.633-4.596a18.666 18.666 0 0 1-2.485 5.33"/></svg>`;
document.querySelectorAll('[data-symbol]').forEach(btn => { btn.innerHTML = fpIcon; });

let codeLength = 7;
let currentIndex = 0;
let display = Array(codeLength).fill('_');
let codeEntry = Array(codeLength).fill('');
screen.textContent = display.join('');

// Web Audio API
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

function playNote(freq) {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.type = 'sine';
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.6);
    osc.start(audioCtx.currentTime);
    osc.stop(audioCtx.currentTime + 0.6);
}

function playNoise() {
    const duration = 0.35;
    const bufferSize = Math.floor(audioCtx.sampleRate * duration);
    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
    const source = audioCtx.createBufferSource();
    source.buffer = buffer;
    const gain = audioCtx.createGain();
    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    source.connect(gain);
    gain.connect(audioCtx.destination);
    source.start();
}

function playGlide() {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(900, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(60, audioCtx.currentTime + 0.5);
    gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
    osc.start(audioCtx.currentTime);
    osc.stop(audioCtx.currentTime + 0.5);
}

setTimeout(() => {
    loading.style.display = 'none';
    keypad.style.display = 'block';
}, 3000);

buttons.forEach(btn => {
    btn.addEventListener('click', () => {
        if (currentIndex < codeLength) {
            if (audioCtx.state === 'suspended') audioCtx.resume();

            const freq = btn.dataset.freq;
            if (freq === 'noise') playNoise();
            else if (freq === 'glide') playGlide();
            else playNote(parseFloat(freq));

            const symbol = btn.dataset.symbol;
            codeEntry[currentIndex] = symbol;
            display[currentIndex] = '*';
            screen.textContent = display.join('');
            currentIndex++;

            if (currentIndex === codeLength) {
                setTimeout(() => {
                    const enteredCode = codeEntry.join('');
                    if (enteredCode === '◈⊕⊛♦♦☢⍟') {
                        keypad.style.display = 'none';
                        const win = document.createElement('div');
                        win.style.cssText = 'position:fixed;inset:0;background:#0a0a0a;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;z-index:9999;padding:1vmin;box-sizing:border-box;';
                        const pdfContent = `<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;gap:3vmin;">
                                <p style="color:#00ff00;font-family:'Courier New',monospace;font-size:clamp(0.8rem,3vmin,1.1rem);text-align:center;margin:0;">Documento classificato disponibile.</p>
                                <a href="info.pdf" target="_blank" style="color:#00ff00;border:2px solid #00ff00;padding:2vmin 5vmin;font-family:'Courier New',monospace;font-size:clamp(0.9rem,3.5vmin,1.2rem);text-decoration:none;letter-spacing:1px;">
                                    ⬇ APRI DOCUMENTO CLASSIFICATO
                                </a>
                               </div>`;
                        win.innerHTML = `
                            <h1 style="color:#00ff00;font-size:clamp(1rem,4vmin,2rem);margin:1vmin 0;">✓ ACCESSO CONSENTITO</h1>
                            ${pdfContent}
                        `;
                        document.body.appendChild(win);
                    } else {
                        screen.style.backgroundColor = '#330000';
                        screen.style.color = '#ff0000';
                        screen.textContent = 'ERROR';
                        setTimeout(() => {
                            currentIndex = 0;
                            display = Array(codeLength).fill('_');
                            codeEntry = Array(codeLength).fill('');
                            screen.textContent = display.join('');
                            screen.style.backgroundColor = '#001100';
                            screen.style.color = '#00ff00';
                        }, 2000);
                    }
                }, 300);
            }
        }
    });
});

document.getElementById('clearBtn').addEventListener('click', () => {
    currentIndex = 0;
    display = Array(codeLength).fill('_');
    codeEntry = Array(codeLength).fill('');
    screen.textContent = display.join('');
});
</script>

</body>
</html>
